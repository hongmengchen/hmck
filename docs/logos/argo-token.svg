<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="argo-token-title">
  <title id="argo-token-title">argo-token</title>
  <!--
    招牌：一把横放的钥匙（Argo CD 的 token 就存在本机那把钥匙里），琥珀色。
    这不是随手画的矢量图，是照着终端网格摆的像素画：
    画布 24 单位宽、24 单位高，一个取样点（终端里半个字符宽、半个字符高）
    是 2 单位宽、4 单位高，每个 rect 正好落进一个取样点；招牌缩成 6 列 × 3 行，
    每格是 2×2 个取样点，边缘就不会有半格相错的毛边。
  -->
  <!-- 钥匙环：左边一个方环，中间留出孔 -->
  <rect x="2" y="4" width="6" height="4" fill="#FBBF24"/>
  <rect x="0" y="8" width="2" height="8" fill="#FBBF24"/>
  <rect x="6" y="8" width="2" height="8" fill="#FBBF24"/>
  <rect x="2" y="16" width="6" height="4" fill="#FBBF24"/>
  <!-- 杆：从钥匙环伸到右边 -->
  <rect x="8" y="12" width="14" height="4" fill="#FBBF24"/>
  <!-- 两个齿 -->
  <rect x="16" y="16" width="2" height="4" fill="#FBBF24"/>
  <rect x="20" y="16" width="2" height="4" fill="#FBBF24"/>
</svg>
