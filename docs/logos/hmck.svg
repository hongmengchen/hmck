<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="hmck-title">
  <title id="hmck-title">hmck</title>
  <!--
    招牌：一个考虑过粗细的 > 加一条下划线，终端提示符的样子。
    这不是随手画的矢量图，是照着终端网格摆的像素画：
    画布 24 单位宽、24 单位高，一个取样点（终端里半个字符宽、半个字符高）
    是 2 单位宽、4 单位高，每个 rect 正好落进一个取样点；招牌缩成 6 列 × 3 行，
    每格是 2×2 个取样点，斜边是一级级台阶，不会出现半格相错的毛边。
  -->
  <rect x="0" y="0" width="6" height="4" fill="#34D399"/>
  <rect x="2" y="4" width="6" height="4" fill="#34D399"/>
  <rect x="4" y="8" width="6" height="4" fill="#34D399"/>
  <rect x="4" y="12" width="6" height="4" fill="#34D399"/>
  <rect x="2" y="16" width="6" height="4" fill="#34D399"/>
  <rect x="0" y="20" width="6" height="4" fill="#34D399"/>
  <rect x="14" y="20" width="8" height="4" fill="#34D399"/>
</svg>
