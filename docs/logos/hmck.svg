<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="hmck-title">
  <title id="hmck-title">hmck</title>
  <!--
    招牌：一个加粗的 > 加一条下划线，终端提示符的样子。
    这不是随手画的矢量图，是照着终端里的取样网格一比一摆的像素画：画布 24 个单位宽、
    24 个单位高，一个像素块 1 单位宽、2 单位高（终端里半个字符宽、一个字符高），
    所以每个 rect 都会正好落进一个像素，渲染出来没有毛边，也不会被阈值吃掉细节。
  -->
  <rect x="0" y="0" width="4" height="2" fill="#34D399"/>
  <rect x="2" y="2" width="4" height="2" fill="#34D399"/>
  <rect x="4" y="4" width="4" height="2" fill="#34D399"/>
  <rect x="6" y="6" width="4" height="2" fill="#34D399"/>
  <rect x="8" y="8" width="4" height="2" fill="#34D399"/>
  <rect x="10" y="10" width="4" height="2" fill="#34D399"/>
  <rect x="10" y="12" width="4" height="2" fill="#34D399"/>
  <rect x="8" y="14" width="4" height="2" fill="#34D399"/>
  <rect x="6" y="16" width="4" height="2" fill="#34D399"/>
  <rect x="4" y="18" width="4" height="2" fill="#34D399"/>
  <rect x="2" y="20" width="4" height="2" fill="#34D399"/>
  <rect x="14" y="20" width="10" height="2" fill="#34D399"/>
  <rect x="0" y="22" width="4" height="2" fill="#34D399"/>
  <rect x="14" y="22" width="10" height="2" fill="#34D399"/>
</svg>
