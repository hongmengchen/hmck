<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="glab-title">
  <title id="glab-title">glab</title>
  <!--
    招牌：GitLab 的狸猫头，两只尖耳朵、一张宽脸、浅色的口鼻。
    这不是随手画的矢量图，是照着终端里的字符格一比一摆的像素画：
    画布 24 单位宽、24 单位高，一个字符格（2×2 个方块像素）是 2 单位宽、
    4 单位高，所以每个 rect 都正好填满整格，斜边是一级级整格台阶，
    不会出现半格相错的毛边。第三行的两个空档是眼睛。
  -->
  <rect x="4" y="0" width="2" height="4" fill="#FC6D26"/>
  <rect x="18" y="0" width="2" height="4" fill="#FC6D26"/>
  <rect x="2" y="4" width="6" height="4" fill="#FC6D26"/>
  <rect x="16" y="4" width="6" height="4" fill="#FC6D26"/>
  <rect x="2" y="8" width="20" height="4" fill="#FC6D26"/>
  <rect x="0" y="12" width="6" height="4" fill="#FC6D26"/>
  <rect x="8" y="12" width="8" height="4" fill="#FC6D26"/>
  <rect x="18" y="12" width="6" height="4" fill="#FC6D26"/>
  <rect x="2" y="16" width="6" height="4" fill="#FC6D26"/>
  <rect x="8" y="16" width="8" height="4" fill="#FCA326"/>
  <rect x="16" y="16" width="6" height="4" fill="#FC6D26"/>
  <rect x="6" y="20" width="12" height="4" fill="#FCA326"/>
</svg>
